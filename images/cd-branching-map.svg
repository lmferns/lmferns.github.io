<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Segoe UI, Calibri, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Branching map: Imaging Systems Service Safety Scenario</title>
  <desc id="d">Three decision points. Each has one correct path that moves forward, one unsafe choice that costs Safety and loops back to try again, and at decisions 1 and 3 a costly choice that costs Trust and Time but continues.</desc>
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4a5a"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c77c0e"/></marker>
  </defs>
  <rect width="1600" height="700" fill="#ffffff"/>

  <!-- Heading -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1d4a5a">Branching map</text>
  <text x="40" y="82" font-size="16" fill="#4a5a63">Every choice changes three scores. Learners start at Safety 3 · Trust 3 · Time +0 min.</text>

  <!-- Setup -->
  <rect x="40" y="130" width="230" height="150" rx="10" fill="#1d4a5a"/>
  <text x="58" y="160" font-size="13" font-weight="700" fill="#f2b13b" letter-spacing="1">SETUP</text>
  <text x="58" y="186" font-size="15" fill="#fff">Learner enters first name</text>
  <text x="58" y="208" font-size="15" fill="#fff">Scoring explained</text>
  <text x="58" y="230" font-size="15" fill="#fff">Service call and objectives</text>
  <text x="58" y="252" font-size="15" fill="#fff">Lockout procedure</text>
  <text x="58" y="274" font-size="15" fill="#fff">On site: manager pressure</text>

  <!-- Decision boxes -->
  <g>
    <rect x="330" y="130" width="280" height="150" rx="10" fill="#e6f1fb" stroke="#1d4a5a" stroke-width="2"/>
    <text x="348" y="158" font-size="13" font-weight="700" fill="#1d4a5a" letter-spacing="1">DECISION 1 · FIRST ACTION</text>
    <text x="348" y="188" font-size="15" fill="#1f2a30">Scanner keeps shutting down.</text>
    <text x="348" y="208" font-size="15" fill="#1f2a30">Six patients are waiting.</text>
    <rect x="348" y="226" width="244" height="40" rx="6" fill="#dff3df"/>
    <text x="358" y="243" font-size="14" font-weight="700" fill="#2e7d32">A ✓ Notify CT staff, then</text>
    <text x="358" y="260" font-size="14" font-weight="700" fill="#2e7d32">lock out the scanner</text>
  </g>
  <g>
    <rect x="680" y="130" width="280" height="150" rx="10" fill="#e6f1fb" stroke="#1d4a5a" stroke-width="2"/>
    <text x="698" y="158" font-size="13" font-weight="700" fill="#1d4a5a" letter-spacing="1">DECISION 2 · NEXT STEP</text>
    <text x="698" y="188" font-size="15" fill="#1f2a30">Lock and tag applied.</text>
    <text x="698" y="208" font-size="15" fill="#1f2a30">Is it really safe to touch?</text>
    <rect x="698" y="226" width="244" height="40" rx="6" fill="#dff3df"/>
    <text x="708" y="243" font-size="14" font-weight="700" fill="#2e7d32">A ✓ Verify zero energy</text>
    <text x="708" y="260" font-size="14" font-weight="700" fill="#2e7d32">with a meter</text>
  </g>
  <g>
    <rect x="1030" y="130" width="280" height="150" rx="10" fill="#e6f1fb" stroke="#1d4a5a" stroke-width="2"/>
    <text x="1048" y="158" font-size="13" font-weight="700" fill="#1d4a5a" letter-spacing="1">DECISION 3 · E-STOP FAULT</text>
    <text x="1048" y="188" font-size="15" fill="#1f2a30">E-stop chain open, fuse blown.</text>
    <text x="1048" y="208" font-size="15" fill="#1f2a30">"Can't you bypass that?"</text>
    <rect x="1048" y="226" width="244" height="40" rx="6" fill="#dff3df"/>
    <text x="1058" y="243" font-size="14" font-weight="700" fill="#2e7d32">A ✓ Test each E-stop, find</text>
    <text x="1058" y="260" font-size="14" font-weight="700" fill="#2e7d32">why the fuse failed</text>
  </g>

  <!-- Results -->
  <rect x="1380" y="130" width="180" height="150" rx="10" fill="#1d4a5a"/>
  <text x="1398" y="160" font-size="13" font-weight="700" fill="#f2b13b" letter-spacing="1">RESULTS</text>
  <text x="1398" y="186" font-size="15" fill="#fff">Personalized with</text>
  <text x="1398" y="206" font-size="15" fill="#fff">learner's name</text>
  <text x="1398" y="234" font-size="15" fill="#fff">Final Safety, Trust</text>
  <text x="1398" y="254" font-size="15" fill="#fff">and Time scores,</text>
  <text x="1398" y="274" font-size="15" fill="#fff">then key takeaways</text>

  <!-- Correct path arrows -->
  <line x1="270" y1="205" x2="326" y2="205" stroke="#1d4a5a" stroke-width="3" marker-end="url(#aT)"/>
  <line x1="610" y1="205" x2="676" y2="205" stroke="#2e7d32" stroke-width="3" marker-end="url(#aG)"/>
  <line x1="960" y1="205" x2="1026" y2="205" stroke="#2e7d32" stroke-width="3" marker-end="url(#aG)"/>
  <line x1="1310" y1="205" x2="1376" y2="205" stroke="#2e7d32" stroke-width="3" marker-end="url(#aG)"/>
  <text x="992" y="196" font-size="12" fill="#2e7d32" text-anchor="middle">Correct!</text>
  <text x="1343" y="196" font-size="12" fill="#2e7d32" text-anchor="middle">Correct!</text>

  <!-- Unsafe boxes -->
  <g>
    <rect x="330" y="340" width="280" height="130" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="348" y="366" font-size="13" font-weight="700" fill="#c0392b" letter-spacing="1">UNSAFE · B</text>
    <text x="348" y="390" font-size="14" fill="#1f2a30">Shut down at the console</text>
    <text x="348" y="408" font-size="14" fill="#1f2a30">and open the cabinet</text>
    <text x="348" y="432" font-size="13" font-style="italic" fill="#4a5a63">Scanner restarts while cabinet is open</text>
    <text x="348" y="456" font-size="14" font-weight="700" fill="#c0392b">Safety −1 · Try again</text>
  </g>
  <g>
    <rect x="680" y="340" width="280" height="130" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="698" y="366" font-size="13" font-weight="700" fill="#c0392b" letter-spacing="1">UNSAFE · B / C</text>
    <text x="698" y="390" font-size="14" fill="#1f2a30">Begin the repair, or ask the</text>
    <text x="698" y="408" font-size="14" fill="#1f2a30">manager to confirm power is off</text>
    <text x="698" y="432" font-size="13" font-style="italic" fill="#4a5a63">A capacitor is still holding a charge</text>
    <text x="698" y="456" font-size="14" font-weight="700" fill="#c0392b">Safety −1 · Try again</text>
  </g>
  <g>
    <rect x="1030" y="340" width="280" height="130" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="1048" y="366" font-size="13" font-weight="700" fill="#c0392b" letter-spacing="1">UNSAFE · B</text>
    <text x="1048" y="390" font-size="14" fill="#1f2a30">Jumper the E-stop circuit</text>
    <text x="1048" y="408" font-size="14" fill="#1f2a30">and return later</text>
    <text x="1048" y="432" font-size="13" font-style="italic" fill="#4a5a63">E-stop fails in a patient emergency</text>
    <text x="1048" y="456" font-size="14" font-weight="700" fill="#c0392b">Safety −1 · Try again</text>
  </g>

  <!-- Unsafe loops (down from decision, back up) -->
  <g fill="none" stroke-width="2.5">
    <line x1="430" y1="280" x2="430" y2="336" stroke="#c0392b" marker-end="url(#aR)"/>
    <line x1="510" y1="340" x2="510" y2="284" stroke="#c0392b" stroke-dasharray="6 5" marker-end="url(#aR)"/>
    <line x1="780" y1="280" x2="780" y2="336" stroke="#c0392b" marker-end="url(#aR)"/>
    <line x1="860" y1="340" x2="860" y2="284" stroke="#c0392b" stroke-dasharray="6 5" marker-end="url(#aR)"/>
    <line x1="1130" y1="280" x2="1130" y2="336" stroke="#c0392b" marker-end="url(#aR)"/>
    <line x1="1210" y1="340" x2="1210" y2="284" stroke="#c0392b" stroke-dasharray="6 5" marker-end="url(#aR)"/>
  </g>

  <!-- Costly boxes -->
  <g>
    <rect x="330" y="520" width="280" height="130" rx="10" fill="#fff4e0" stroke="#c77c0e" stroke-width="2"/>
    <text x="348" y="546" font-size="13" font-weight="700" fill="#a8650a" letter-spacing="1">COSTLY · C</text>
    <text x="348" y="570" font-size="14" fill="#1f2a30">Ask facilities to cut power</text>
    <text x="348" y="588" font-size="14" fill="#1f2a30">to the entire room</text>
    <text x="348" y="612" font-size="13" font-style="italic" fill="#4a5a63">40-minute wait, escalated to manager</text>
    <text x="348" y="636" font-size="14" font-weight="700" fill="#a8650a">Trust −1 · Time +40 · Continue</text>
  </g>
  <g>
    <rect x="1030" y="520" width="280" height="130" rx="10" fill="#fff4e0" stroke="#c77c0e" stroke-width="2"/>
    <text x="1048" y="546" font-size="13" font-weight="700" fill="#a8650a" letter-spacing="1">COSTLY · C</text>
    <text x="1048" y="570" font-size="14" fill="#1f2a30">Replace the fuse and restart,</text>
    <text x="1048" y="588" font-size="14" fill="#1f2a30">no further testing</text>
    <text x="1048" y="612" font-size="13" font-style="italic" fill="#4a5a63">Scanner fails again mid-scan</text>
    <text x="1048" y="636" font-size="14" font-weight="700" fill="#a8650a">Trust −1 · Time +40 · Continue</text>
  </g>

  <!-- Costly arrows: down from decision, then forward -->
  <g fill="none" stroke="#c77c0e" stroke-width="2.5">
    <path d="M 350 280 L 350 300 L 318 300 L 318 585 L 326 585" marker-end="url(#aA)"/>
    <path d="M 610 585 L 645 585 L 645 250 L 676 250" stroke-dasharray="6 5" marker-end="url(#aA)"/>
    <path d="M 1050 280 L 1050 300 L 1018 300 L 1018 585 L 1026 585" marker-end="url(#aA)"/>
    <path d="M 1310 585 L 1345 585 L 1345 250 L 1376 250" stroke-dasharray="6 5" marker-end="url(#aA)"/>
  </g>

  <!-- Legend -->
  <g font-size="14" fill="#1f2a30">
    <rect x="1380" y="520" width="180" height="130" rx="10" fill="#f5f7f8"/>
    <line x1="1396" y1="550" x2="1430" y2="550" stroke="#2e7d32" stroke-width="3"/>
    <text x="1440" y="555">Correct</text>
    <line x1="1396" y1="585" x2="1430" y2="585" stroke="#c0392b" stroke-width="3"/>
    <text x="1440" y="590">Unsafe</text>
    <line x1="1396" y1="620" x2="1430" y2="620" stroke="#c77c0e" stroke-width="3"/>
    <text x="1440" y="625">Costly</text>
  </g>
</svg>
